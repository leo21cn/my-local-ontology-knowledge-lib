# ============================================================
# ontology-ai-knowledge-lib.smartmoves.com.cn vhost
# 用途: 通过域名对外展示「利用本体能力增强的AI赋能知识库系统」宣传幻灯片
# 模式与 sparkwave / esw / aio 一致:
#   - 静态文件目录: /var/www/ontology-ai-knowledge-lib/index.html
#   - 复用 *.smartmoves.com.cn 通配符证书
#   - HTTP 80 -> HTTPS 443 跳转
# ============================================================

server {
    listen 80;
    server_name ontology-ai-knowledge-lib.smartmoves.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ontology-ai-knowledge-lib.smartmoves.com.cn;

    ssl_certificate     /etc/nginx/ssl/wildcard-smartmoves/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-smartmoves/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    root /var/www/ontology-ai-knowledge-lib;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpe?g|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
