name: center-kb

services:
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.18
    container_name: kb-qdrant
    ports:
      - "127.0.0.1:6340:6333"
      - "127.0.0.1:6341:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: docker.m.daocloud.io/neo4j:5.26-community
    container_name: kb-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/redis:7-alpine
    container_name: kb-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: ./app
    container_name: kb-api
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - ./knowledge-lib-base-folder:/corpus:ro
      - ./ontology:/ontology
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      KB_AUTH_TOKEN: ${KB_AUTH_TOKEN}
      KB_EMBED_MODEL: ${KB_EMBED_MODEL}
      KB_EMBED_DIM: ${KB_EMBED_DIM}
      KB_EMBED_BATCH: ${KB_EMBED_BATCH}
      KB_EMBED_PRICE_PER_1K_TOKENS: ${KB_EMBED_PRICE_PER_1K_TOKENS}
      KB_POLL_INTERVAL_MINUTES: ${KB_POLL_INTERVAL_MINUTES}
      KB_CORPUS_ROOT: /corpus
      KB_ONTOLOGY_EXPORT_DIR: /ontology
      KB_EXTRACT_MODEL: ${KB_EXTRACT_MODEL}
      KB_EXTRACT_PRICE_PER_1K_TOKENS: ${KB_EXTRACT_PRICE_PER_1K_TOKENS}
      KB_EXTRACT_CONCURRENCY: ${KB_EXTRACT_CONCURRENCY}
      KB_INDUCT_SAMPLE_LIMIT: ${KB_INDUCT_SAMPLE_LIMIT}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    depends_on: [qdrant, neo4j, redis]
    restart: unless-stopped

  worker:
    build: ./app
    container_name: kb-worker
    command: arq kb.worker.WorkerSettings
    volumes:
      - ./knowledge-lib-base-folder:/corpus:ro
      - ./ontology:/ontology
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      KB_AUTH_TOKEN: ${KB_AUTH_TOKEN}
      KB_EMBED_MODEL: ${KB_EMBED_MODEL}
      KB_EMBED_DIM: ${KB_EMBED_DIM}
      KB_EMBED_BATCH: ${KB_EMBED_BATCH}
      KB_EMBED_PRICE_PER_1K_TOKENS: ${KB_EMBED_PRICE_PER_1K_TOKENS}
      KB_POLL_INTERVAL_MINUTES: ${KB_POLL_INTERVAL_MINUTES}
      KB_CORPUS_ROOT: /corpus
      KB_ONTOLOGY_EXPORT_DIR: /ontology
      KB_EXTRACT_MODEL: ${KB_EXTRACT_MODEL}
      KB_EXTRACT_PRICE_PER_1K_TOKENS: ${KB_EXTRACT_PRICE_PER_1K_TOKENS}
      KB_EXTRACT_CONCURRENCY: ${KB_EXTRACT_CONCURRENCY}
      KB_INDUCT_SAMPLE_LIMIT: ${KB_INDUCT_SAMPLE_LIMIT}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    depends_on: [qdrant, neo4j, redis]
    restart: unless-stopped

  web:
    build: ./web
    container_name: kb-web
    ports:
      - "127.0.0.1:8100:8100"
    depends_on: [api]
    restart: unless-stopped

volumes:
  qdrant-data:
  neo4j-data:
  redis-data:


