server {
    listen 8100;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8101;
        proxy_set_header Host $host;
    }

    location /retrieval {
        proxy_pass http://api:8101;
        proxy_set_header Host $host;
    }

    location /mcp {
        proxy_pass http://api:8101;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
