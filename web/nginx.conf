server {
    listen 8100;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://api:8101;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /retrieval {
        set $api_upstream http://api:8101;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location /mcp {
        set $api_upstream http://api:8101;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
