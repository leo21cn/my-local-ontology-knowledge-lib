<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g>
    <rect x="220" y="16"  width="300" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="42" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">数据湖知识文档目录</text>
    <text x="370" y="64" text-anchor="middle" font-size="13" fill="#6b7280">推荐知识归档用 Markdown 格式</text>

    <line x1="370" y1="76" x2="370" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="220" y="102" width="300" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="128" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">切片 &amp; 嵌入</text>
    <text x="370" y="150" text-anchor="middle" font-size="13" fill="#6b7280">text-embedding-v4</text>

    <line x1="370" y1="162" x2="370" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="220" y="188" width="300" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="214" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">检索索引 Qdrant</text>
    <text x="370" y="236" text-anchor="middle" font-size="13" fill="#6b7280">向量 + 载荷</text>

    <line x1="370" y1="248" x2="370" y2="272" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="220" y="274" width="300" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="300" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">语义索引 Neo4j</text>
    <text x="370" y="322" text-anchor="middle" font-size="13" fill="#6b7280">本体 + 实体图谱</text>

    <line x1="370" y1="334" x2="370" y2="358" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="220" y="360" width="300" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="386" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">服务层 FastAPI + arq</text>
    <text x="370" y="408" text-anchor="middle" font-size="13" fill="#6b7280">同步 / 重建 / 归纳 / 抽取</text>

    <line x1="520" y1="390" x2="560" y2="390" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="562" y="360" width="290" height="60" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="707" y="386" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2329">消费层</text>
    <text x="707" y="408" text-anchor="middle" font-size="13" fill="#6b7280">Web · Dify · MCP · 智能体</text>
  </g>

  <!-- LLM side node -->
  <rect x="52" y="360" width="140" height="60" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="122" y="386" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2329">可配置 LLM</text>
  <text x="122" y="406" text-anchor="middle" font-size="12" fill="#6b7280">如 Qwen3.8-flash</text>
  <line x1="192" y1="390" x2="216" y2="390" stroke="#93c5fd" stroke-width="2" marker-end="url(#arr)"/>
</svg>
