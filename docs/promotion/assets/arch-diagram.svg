<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g>
    <rect x="200" y="20"  width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">数据湖知识文档目录</text>
    <text x="330" y="61" text-anchor="middle" font-size="11" fill="#6b7280">推荐知识归档用 Markdown 格式</text>

    <line x1="330" y1="72" x2="330" y2="96" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="200" y="98" width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">切片 &amp; 嵌入</text>
    <text x="330" y="139" text-anchor="middle" font-size="11" fill="#6b7280">text-embedding-v4</text>

    <line x1="330" y1="150" x2="330" y2="174" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="200" y="176" width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">检索索引 Qdrant</text>
    <text x="330" y="217" text-anchor="middle" font-size="11" fill="#6b7280">向量 + 载荷</text>

    <line x1="330" y1="228" x2="330" y2="252" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="200" y="254" width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">语义索引 Neo4j</text>
    <text x="330" y="295" text-anchor="middle" font-size="11" fill="#6b7280">本体 + 实体图谱</text>

    <line x1="330" y1="306" x2="330" y2="330" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="200" y="332" width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">服务层 FastAPI + arq</text>
    <text x="330" y="373" text-anchor="middle" font-size="11" fill="#6b7280">同步 / 重建 / 归纳 / 抽取</text>

    <line x1="330" y1="384" x2="330" y2="408" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="200" y="410" width="260" height="52" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="432" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2329">消费层</text>
    <text x="330" y="451" text-anchor="middle" font-size="11" fill="#6b7280">Web · Dify · MCP · 智能体</text>
  </g>

  <!-- LLM side node -->
  <rect x="48" y="330" width="120" height="56" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="108" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2329">可配置 LLM</text>
  <text x="108" y="370" text-anchor="middle" font-size="10" fill="#6b7280">如 Qwen3.8-flash</text>
  <line x1="168" y1="358" x2="196" y2="358" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
